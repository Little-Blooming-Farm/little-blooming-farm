# Netlify alternative to vercel.json. Set the base directory to `client`.

[build]
  base    = "client"
  command = "npm ci && npm run build"
  publish = "dist"

# Client-side routing: every unknown path must serve index.html, otherwise
# deep links like /booking/manage/<token> 404 on refresh.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
