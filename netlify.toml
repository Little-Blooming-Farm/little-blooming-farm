# Netlify configuration for the React site.
#
# This file MUST live at the repository root. Netlify reads `netlify.toml` from
# the root of the repo, not from the base directory — a copy inside `client/`
# is silently ignored, which costs you the SPA redirect and every header below.
# `base` is what points the build at the client app.
#
# The Express API is not deployed here; it needs a Node runtime and lives on
# Render. See DEPLOYMENT.md.

[build]
  base    = "client"
  # `--include=dev` is not optional. vite, tailwindcss, postcss and autoprefixer
  # are all devDependencies, and npm silently skips devDependencies whenever
  # NODE_ENV=production is set in the build environment. The failure is
  # `vite: not found` at the build step, long after install reports success.
  command = "npm ci --include=dev && npm run build"
  publish = "dist"          # relative to `base`, i.e. client/dist

[build.environment]
  # Also pinned in client/.node-version. Without a pin, hosts take the newest
  # release available, which is ahead of what this is verified against.
  NODE_VERSION = "24"
  # Belt and braces with `--include=dev` above: this is the setting npm actually
  # consults, and it survives someone adding NODE_ENV=production in the Netlify
  # UI. Do NOT set NODE_ENV=production here — it buys nothing for a static build
  # and only removes the tools that produce it.
  NPM_CONFIG_INCLUDE = "dev"

# Send www to the apex, so the site has exactly one canonical origin.
#
# This matters beyond tidiness: the API's CORS allow-list and the admin session
# cookie are both per-origin. A guest who arrives on www would otherwise be on
# an origin the API may not recognise, and would see every request fail for no
# visible reason. Must come BEFORE the SPA catch-all — Netlify applies the
# first matching rule.
[[redirects]]
  from   = "https://www.thelittlebloomingfarm.com/*"
  to     = "https://thelittlebloomingfarm.com/:splat"
  status = 301
  force  = true

# Client-side routing. Every unknown path must serve index.html, or deep links
# like /booking/manage/<token> return 404 on refresh — which would break the
# link emailed to every guest.
#
# Duplicated in client/public/_redirects on purpose: that file ships inside the
# build output and works even if this config is ever missed.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Vite fingerprints these filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    # Photographs live at stable paths — /media/home/hero-poster.jpg keeps its
    # name when the picture behind it changes. A week-long max-age therefore
    # pins whatever a visitor happened to fetch first: replacing the 640px
    # originals with sharp ones changed nothing for anyone who had already
    # loaded the page, because the browser never asked again.
    #
    # Short freshness plus a long stale-while-revalidate keeps that from
    # happening: the CDN still answers instantly from cache, and it refreshes
    # in the background, so a replaced photograph appears within minutes rather
    # than a week. Netlify already sends an ETag, so the revalidation is a
    # cheap 304 when nothing changed.
    #
    # Fingerprinted /assets/* keep their immutable year below — those filenames
    # change whenever their contents do, so they can never go stale.
    Cache-Control = "public, max-age=600, stale-while-revalidate=604800"
